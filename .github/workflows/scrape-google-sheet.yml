name: Refresh Google Sheets stats

on:
  workflow_dispatch:
    inputs:
      spreadsheet_id:
        description: Google spreadsheet ID (not its URL)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sheet-scrape-${{ inputs.spreadsheet_id }}
  cancel-in-progress: false

jobs:
  scrape:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: google-sheets
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SPREADSHEET_ID: ${{ inputs.spreadsheet_id }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.10'
          enable-cache: false

      - name: Install locked production dependencies
        run: uv sync --frozen --no-dev

      - name: Validate input and federation settings
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from roster_scraper.actions import parse_spreadsheet_id

          parse_spreadsheet_id(os.environ['SPREADSHEET_ID'])
          for name in ('GCP_WORKLOAD_IDENTITY_PROVIDER', 'GCP_SERVICE_ACCOUNT'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing GitHub environment variable: {name}')
          PY

      - name: Authenticate to Google without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Refresh stats from spreadsheet configuration
        run: uv run --no-sync yahoo-roster-scraper-actions --spreadsheet-id "$SPREADSHEET_ID"
