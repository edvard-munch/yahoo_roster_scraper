[project]
name = "yahoo-roster-scraper"
version = "0.1.0"
description = "Yahoo fantasy hockey roster scraper"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.11.1",
    "bs4==0.0.1",
    "cachetools==5.3.2",
    "certifi==2026.10.23",
    "cffi==2.0.0",
    "charset-normalizer==2.1.1",
    "colorama==0.4.6",
    "cryptography==50.0.2",
    "docopt==0.6.2",
    "fastapi==0.162.0",
    "google-api-core==2.25.2",
    "google-api-python-client==2.179.0",
    "google-auth==2.41.1",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.2",
    "googleapis-common-protos==1.70.0",
    "httplib2==0.32.0",
    "idna==3.20",
    "importlib-metadata==7.0.0",
    "lxml==6.1.3",
    "num2words==0.5.13",
    "oauthlib==4.0.0",
    "protobuf==5.29.6",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==2.22",
    "pyparsing==3.1.1",
    "requests==2.33.0",
    "requests-oauthlib==1.3.1",
    "rsa==4.9",
    "simpleeval==1.0.5",
    "soupsieve==3.0.4",
    "starlette==1.10.0",
    "tomli==2.0.1",
    "tzdata==2026.5",
    "uritemplate==4.1.1",
    "urllib3==2.8.0",
    "uvicorn==0.34.2",
    "xlsxwriter==3.1.9",
    "zipp==3.19.1",
]

[project.scripts]
yahoo-roster-scraper = "roster_scraper.cli:main"
yahoo-roster-scraper-actions = "roster_scraper.actions:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pre-commit>=4.3.0,<5.0.0",
    "pytest>=9.0.3,<10",
    "pyyaml==6.0.3",
    "ruff>=0.12.0,<1.0.0",
    "virtualenv==21.14.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roster_scraper"]
